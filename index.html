  <body>
    <canvas aria-hidden="true"></canvas>

    <!-- Displacement map for the liquid-glass refraction. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="11" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="40" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div class="top-bar">
      <div class="choices glass" role="radiogroup" aria-label="Animal"></div>
    </div>

    <!-- The time in character cells (ascii-koi's AsciiMark), top left. -->

      <canvas id="ascii-clock" class="ascii-clock" aria-hidden="true"></canvas>
      <canvas id="ascii-ampm" class="ascii-ampm" aria-hidden="true"></canvas>
    </div>

    <header class="top-layout">
      <nav class="shortcuts" aria-label="Shortcuts"></nav>
      <form class="searchbar glass" action="https://www.google.com/search" method="get" autocomplete="off" role="search">
        <svg class="search-g" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">

          <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z" />
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z" />

        <input type="text" name="q" placeholder="Search the web" aria-label="Search the web">

    </header>

    <main class="stage">
      <!-- Dia's mark, cut out of a screenshot (a concept redesign, not affiliated with Dia). -->
